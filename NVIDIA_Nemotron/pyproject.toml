[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-icb-copilot"
version = "0.1.0"
description = "Local research copilot for multimodal ICB prediction interpretation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nemotron-copilot = "icb_copilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["nemotron_copilot"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icb_copilot = ["skills/*/SKILL.md", "skills/*/references/*.json", "skills/*/references/*.md"]
